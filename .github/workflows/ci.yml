name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The seed compiler builds the compiler, which rebuilds itself to a byte-identical
      # fixpoint, then every golden program is compiled, run and compared.
      - name: Self-compile fixpoint and golden programs
        shell: cmd
        env:
          PI_NO_GPU: "1"   # hosted runners have no NVIDIA GPU, so gpuforms is skipped
        run: test.cmd

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The same suite with the Linux compiler: its own fixpoint, the Windows compiler cross-built and
      # compared with seed/pic.exe, and the same golden files.
      - name: Self-compile fixpoint and golden programs
        run: ./test.sh
