name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The seed compiler builds the compiler, which rebuilds itself to a byte-identical
      # fixpoint, then every golden program is compiled, run and compared.
      - name: Self-compile fixpoint and golden programs
        shell: cmd
        run: test.cmd
